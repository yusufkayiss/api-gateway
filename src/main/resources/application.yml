server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      routes:
        # Core API Servisine Giden İstekler
        - id: ecommerce-core-api
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/products/**, /api/v1/orders/**, /api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        # Notification Servisine Giden İstekler
        - id: notification-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, gateway
  endpoint:
    health:
      show-details: always